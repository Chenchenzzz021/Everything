<body>
<div id="app"></div>
<script>
'use strict';
// ===== Cấu hình máy chủ (Firestore qua REST, đăng nhập ẩn danh) =====
const FB={apiKey:"AIzaSyA8VPIZIhQjpcXeB6PD_G2b9FfVp7wmReM",projectId:"everything-2dec6"};
const COL='doita'; // couples: doita/{mã} ; vị trí: doita/{mã}/loc/{uid} ; địa điểm: doita/{mã}/places/{id}
const DEMO=/[?&]demo=1/.test(location.search);

// ===== Lưu trữ cục bộ =====
const LS={get(k,d){try{const v=localStorage.getItem('dt_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('dt_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('dt_'+k)}catch(e){}}};

// ===== Mã hoá giá trị Firestore =====
function enc(v){if(v===null||v===undefined)return{nullValue:null};if(typeof v==='boolean')return{booleanValue:v};
  if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(enc)}};
  if(typeof v==='object'){const f={};for(const k in v)f[k]=enc(v[k]);return{mapValue:{fields:f}}}return{stringValue:String(v)}}
function dec(x){if(!x)return null;if('stringValue'in x)return x.stringValue;if('integerValue'in x)return+x.integerValue;if('doubleValue'in x)return x.doubleValue;
  if('booleanValue'in x)return x.booleanValue;if('nullValue'in x)return null;if('timestampValue'in x)return Date.parse(x.timestampValue);
  if('arrayValue'in x)return(x.arrayValue.values||[]).map(dec);if('mapValue'in x)return decF(x.mapValue.fields||{});return null}
function decF(f){const o={};for(const k in f)o[k]=dec(f[k]);return o}
const encF=o=>{const f={};for(const k in o)f[k]=enc(o[k]);return f};

// ===== Máy chủ thật =====
const NET={tok:null,uid:null,exp:0};
const ff=(u,o={})=>fetch(u,Object.assign({signal:AbortSignal.timeout?AbortSignal.timeout(12000):undefined},o));
async function auth(){
  if(NET.tok&&Date.now()<NET.exp-60e3)return NET.tok;
  const k=FB.apiKey,sv=LS.get('fb',null);let r;
  if(sv&&sv.rt){try{r=await (await ff(`https://securetoken.googleapis.com/v1/token?key=${k}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(sv.rt)})).json();
    if(r.id_token){NET.tok=r.id_token;NET.uid=r.user_id;NET.exp=Date.now()+(+r.expires_in||3600)*1e3;LS.set('fb',{rt:r.refresh_token,uid:r.user_id});return NET.tok}}catch(e){if(sv.uid){NET.uid=sv.uid;throw new Error('offline')}}}
  if(sv&&sv.rt&&r&&r.error)throw new Error('SESSION_EXPIRED');
  throw new Error('NOAUTH')}
// ===== Tài khoản: tên đăng nhập + mật khẩu (Firebase Email/Password) =====
const normU=u=>String(u||'').trim().toLowerCase();
const EMAIL=u=>normU(u)+'@everything-app.web.app';
function setSess(r){NET.tok=r.idToken;NET.uid=r.localId;NET.exp=Date.now()+(+r.expiresIn||3600)*1e3;LS.set('fb',{rt:r.refreshToken,uid:r.localId})}
async function idt(path,body){const r=await (await ff(`https://identitytoolkit.googleapis.com/v1/accounts:${path}?key=${FB.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({returnSecureToken:true},body))})).json();
  if(r.error)throw new Error(r.error.message||'AUTH');return r}
const base=()=>`https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
async function req(path,o={}){const t=await auth();const r=await ff(base()+path,Object.assign({},o,{headers:{'Content-Type':'application/json',Authorization:'Bearer '+t}}));
  if(r.status===404)return null;const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error((j.error&&j.error.message)||('HTTP '+r.status));e.status=r.status;throw e}return j}
const mask=o=>Object.keys(o).map(k=>'updateMask.fieldPaths='+encodeURIComponent(k)).join('&');
const REAL={
  async uid(){await auth();return NET.uid},
  async register(u,p){const sv=LS.get('fb',null);
    if(sv&&sv.rt){let t=null;try{t=await auth()}catch(e){}if(t){setSess(await idt('update',{idToken:t,email:EMAIL(u),password:p}));return}}
    setSess(await idt('signUp',{email:EMAIL(u),password:p}))},
  async login(u,p){setSess(await idt('signInWithPassword',{email:EMAIL(u),password:p}))},
  async getProfile(){const d=await req(`/users/${NET.uid}`);return d?decF(d.fields||{}):{}},
  async saveProfile(o){await req(`/users/${NET.uid}?${mask(o)}`,{method:'PATCH',body:JSON.stringify({fields:encF(o)})})},
  async getCouple(c){const d=await req(`/${COL}/${c}`);return d?decF(d.fields||{}):null},
  async createCouple(c,title){await req(`/${COL}/${c}?currentDocument.exists=false`,{method:'PATCH',body:JSON.stringify({fields:encF({members:[NET.uid],title:title||'',t:Date.now()})})})},
  async patchCouple(c,o){await req(`/${COL}/${c}?${mask(o)}&currentDocument.exists=true`,{method:'PATCH',body:JSON.stringify({fields:encF(o)})})},
  async setLoc(c,o){await req(`/${COL}/${c}/loc/${NET.uid}`,{method:'PATCH',body:JSON.stringify({fields:encF(o)})})},
  async delLoc(c){await req(`/${COL}/${c}/loc/${NET.uid}`,{method:'DELETE'})},
  async listLoc(c){const j=await req(`/${COL}/${c}/loc?pageSize=50`);return((j&&j.documents)||[]).map(d=>Object.assign({id:d.name.split('/').pop()},decF(d.fields||{})))},
  async listPlaces(c){let out=[],tk='';for(let i=0;i<10;i++){const j=await req(`/${COL}/${c}/places?pageSize=300${tk?'&pageToken='+tk:''}`);
    out=out.concat(((j&&j.documents)||[]).map(d=>Object.assign({id:d.name.split('/').pop()},decF(d.fields||{}))));if(!j||!j.nextPageToken)break;tk=j.nextPageToken}return out},
  async savePlace(c,id,o){await req(`/${COL}/${c}/places/${id}?${mask(o)}`,{method:'PATCH',body:JSON.stringify({fields:encF(o)})})},
  async delPlace(c,id){await req(`/${COL}/${c}/places/${id}`,{method:'DELETE'})},
  // ảnh: chỉ lấy thông tin (không lấy ảnh) những tấm mình được xem
  async listPhotos(c){const q={from:[{collectionId:'photos'}],where:{fieldFilter:{field:{fieldPath:'see'},op:'ARRAY_CONTAINS',value:{stringValue:NET.uid}}},select:{fields:['by','t','cap','see','fr'].map(f=>({fieldPath:f}))}};
    const j=await req(`/${COL}/${c}:runQuery`,{method:'POST',body:JSON.stringify({structuredQuery:q})});return(j||[]).filter(x=>x.document).map(x=>Object.assign({id:x.document.name.split('/').pop()},decF(x.document.fields||{})))},
  async getPhoto(c,id){const d=await req(`/${COL}/${c}/photos/${id}`);return d?decF(d.fields||{}):null},
  async addPhoto(c,id,o){await req(`/${COL}/${c}/photos/${id}?currentDocument.exists=false`,{method:'PATCH',body:JSON.stringify({fields:encF(o)})})},
  async updPhoto(c,id,o){await req(`/${COL}/${c}/photos/${id}?${mask(o)}`,{method:'PATCH',body:JSON.stringify({fields:encF(o)})})},
  async delPhoto(c,id){await req(`/${COL}/${c}/photos/${id}`,{method:'DELETE'})},
  async listSub(path,order,lim){const q={from:[{collectionId:path.split('/').pop()}]};if(order){q.orderBy=[{field:{fieldPath:order},direction:'DESCENDING'}];q.limit=lim||60}
    const par=path.split('/').slice(0,-1).join('/');const j=await req(`/${par}:runQuery`,{method:'POST',body:JSON.stringify({structuredQuery:q})});
    return(j||[]).filter(x=>x.document).map(x=>Object.assign({id:x.document.name.split('/').pop()},decF(x.document.fields||{})))},
  async put(path,o,m){await req(`/${path}${m?'?'+mask(o):''}`,{method:'PATCH',body:JSON.stringify({fields:encF(o)})})},
  async del(path){await req(`/${path}`,{method:'DELETE'})},
  async getDoc(path){const d=await req(`/${path}`);return d?decF(d.fields||{}):null},

}

    if(last!=null&&Math.abs(last-S.bat)>=5&&S.code)pushId();if(last==null)last=S.bat;else if(Math.abs(last-S.bat)>=5)last=S.bat};f();b.addEventListener('levelchange',f);b.addEventListener('chargingchange',f)}).catch(()=>{})}

    try{const LV=await API.listLv(S.code);for(const x of LV){const l=locs.find(y=>y.id===x.o);if(l&&(x.t||0)>=(l.t||0))LVK.forEach(k=>{if(x[k]!==undefined)l[k]=x[k]})}}catch(e){}
    S.couple=c;S.locs=locs;S.me=locs.find(l=>l.id===uid)||S.me;
    const rn=(S.rn=(S.rn||0)+1);if(rn%4===1)loadPhotos();if(rn%2===1||S.tab==='chat')loadChats();if(rn%2===1||S.tab==='game')loadGames();

// ----- máy chơi ca rô: chấm điểm từng ô theo thế công và thế thủ -----
function caroAI(b,me){const op=me==='x'?'o':'x',N=CN;if(!b.includes('x')&&!b.includes('o'))return 112;
  const line=(i,ch)=>{const r=Math.floor(i/N),c=i%N;let sc=0;for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let cnt=1,open=0;
      for(const s of [1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<N&&cc>=0&&cc<N&&b[rr*N+cc]===ch){cnt++;rr+=dr*s;cc+=dc*s}if(rr>=0&&rr<N&&cc>=0&&cc<N&&b[rr*N+cc]==='.')open++}
      sc+=cnt>=5?1e6:cnt===4?(open===2?5e4:open===1?6e3:0):cnt===3?(open===2?4e3:open===1?400:0):cnt===2?(open===2?200:open===1?30:0):(open===2?8:2)}return sc};
  let best=-1,bi=-1;for(let i=0;i<N*N;i++){if(b[i]!=='.')continue;const r=Math.floor(i/N),c=i%N;let near=false;
    for(let dr=-2;dr<=2&&!near;dr++)for(let dc=-2;dc<=2;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N&&b[rr*N+cc]!=='.'){near=true;break}}if(!near)continue;
    const v=line(i,me)*1.1+line(i,op)+Math.random()*3;if(v>best){best=v;bi=i}}return bi<0?b.indexOf('.'):bi}
// ----- máy chơi cá ngựa: về đích > đá quân > xuất quân > tránh bị đá > đi quân xa nhất -----
function ludoAI(g,M){const n=g.pl.length,s=g.turn,sl=SLOT(g)[s],P=g.pos;
  const danger=(t)=>{if(t>50)return false;const a=absOf(sl,t);if(SAFE.includes(a))return false;for(let o=0;o<n;o++){if(o===s)continue;const so=SLOT(g)[o];for(let j=0;j<4;j++){const q=P[o*4+j];if(q>=0&&q<=50){const qa=absOf(so,q),dist=(a-qa+52)%52;if(dist>=1&&dist<=6)return true}}}return false};
  let best=null,bv=-1e9;for(const m of M){const cur=P[s*4+m.k];let v=0;if(m.t===56)v+=1000;const {kicked}=ludoApply(g,m.k,m.t);v+=kicked*800;if(cur===-1)v+=600;
    if(m.t>50&&cur<=50)v+=300;if(danger(m.t))v-=250;if(cur>=0&&cur<=50&&danger(cur))v+=150;v+=m.t*2+Math.random()*5;if(v>bv){bv=v;best=m}}return best}
function startState(g){const o={st:'play',turn:0,upd:Date.now(),msg:''};if(g.type==='ludo'){const cs=(g.cs&&g.cs.length===4?g.cs:['','','','']).map(u=>u&&(g.pl||[]).includes(u)?u:'');

    if(g.bots===false){o.sl=[0,1,2,3].filter(i=>cs[i]);o.pl=o.sl.map(i=>cs[i])}else{o.pl=cs.map(u=>u||B.shift());o.sl=[0,1,2,3]}
    o.pos=Array(o.pl.length*4).fill(-1);o.d=0;o.rolled=false}
  if(g.type==='ty'){const pl=(g.pl||[]).slice(0,4);if(g.bots!==false)['bot1','bot2','bot3'].forEach(b=>{if(pl.length<4)pl.push(b)});Object.assign(o,tyDiff(tyInit(pl)));o.tc=tyColors(pl,g.tcs);o.sk=tySkills(pl,g.tcs);o.st='play'}

const CN=15;
function caroWin(b,i){const ch=b[i];if(ch==='.')return null;const r=Math.floor(i/CN),c=i%CN;for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const L=[i];
    for(const s of [1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<CN&&cc>=0&&cc<CN&&b[rr*CN+cc]===ch){L.push(rr*CN+cc);rr+=dr*s;cc+=dc*s}}if(L.length>=5)return L}return null}

const LPATH=(()=>{const P=[];for(let c=1;c<=5;c++)P.push([6,c]);for(let r=5;r>=0;r--)P.push([r,6]);P.push([0,7],[0,8]);for(let r=1;r<=5;r++)P.push([r,8]);for(let c=9;c<=14;c++)P.push([6,c]);P.push([7,14],[8,14]);
  for(let c=13;c>=9;c--)P.push([8,c]);for(let r=9;r<=14;r++)P.push([r,8]);P.push([14,7],[14,6]);for(let r=13;r>=9;r--)P.push([r,6]);for(let c=5;c>=0;c--)P.push([8,c]);P.push([7,0],[6,0]);return P})();
const LHOME=[[1,2,3,4,5].map(c=>[7,c]),[1,2,3,4,5].map(r=>[r,7]),[13,12,11,10,9].map(c=>[7,c]),[13,12,11,10,9].map(r=>[r,7])];
const LYARD=[[0,0],[0,9],[9,9],[9,0]],LCOL=['#ef4444','#22c55e','#eab308','#3b82f6'],LCOL2=['#fee2e2','#dcfce7','#fef9c3','#dbeafe'];
const SAFE=[0,13,26,39];
const SLOT=g=>g.sl&&g.sl.length===g.pl.length?g.sl:slotsOf(g.pl.length);
const slotsOf=n=>n===2?[0,2]:n===3?[0,1,2]:[0,1,2,3];
const absOf=(slot,rel)=>(slot*13+rel)%52;
function ludoMoves(g,d){const n=g.pl.length,s=g.turn,sl=SLOT(g)[s],P=g.pos,mine=[0,1,2,3].map(k=>P[s*4+k]),M=[];
  for(let k=0;k<4;k++){const p=mine[k];let t;if(p===-1){if(d!==6)continue;t=0}else{if(p===56||p+d>56)continue;t=p+d}
    if(t<56&&mine.some((q,j)=>j!==k&&q===t))continue;M.push({k,t})}return M}
function ludoApply(g,k,t){const n=g.pl.length,s=g.turn,sl=SLOT(g)[s],P=g.pos.slice();P[s*4+k]=t;let kicked=0;
  if(t<=50){const a=absOf(sl,t);if(!SAFE.includes(a))for(let o=0;o<n;o++){if(o===s)continue;const so=SLOT(g)[o];for(let j=0;j<4;j++){const q=P[o*4+j];if(q>=0&&q<=50&&absOf(so,q)===a){P[o*4+j]=-1;kicked++}}}}
  return{P,kicked}}

function tyInit(pl){const a=PROV.map((x,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}const cities=a.slice(0,TY_NC).sort((x,y)=>x-y);tyUse({cities});return{cities,pl,pos:pl.map(()=>0),cash:pl.map(()=>TY_START),own:TB.map(()=>-1),lv:TB.map(()=>0),skip:pl.map(()=>0),out:pl.map(()=>0),d1:0,d2:0,ph:'roll',turn:0,rd:0,pot:0,dbl:0,msg:'',ev:'',hot:-1,hotr:0,wev:'',cold:-1,coldr:0,wlr:0,wp:TY_WP[Math.floor(Math.random()*TY_WP.length)]}}

async function measDraw(fit){if(!MS.a||!MS.b||!MS.ly)return;const A=MS.a.getLatLng(),B=MS.b.getLatLng();
  if(MS.rt){MS.ly.removeLayer(MS.rt);MS.rt=null}
  const box=r=>`<div class="mres"><span>🛵 Quãng đường đi</span><b>${r==null?'<i class="mut">đang tính…</i>':r===0?'<i class="mut">không tìm được đường đi</i>':fmtDist(r.distance)}</b>${r&&r.duration?`<small>khoảng ${fmtDur(r.duration*1.3)} đi xe máy</small>`:''}</div><div class="row" style="gap:8px;margin-top:8px"><button class="btn sec grow" id="mr">📏 Đo lại</button><button class="btn gh grow" id="mx">Đóng</button></div><div class="mut" style="font-size:11px;margin-top:4px">Kéo điểm A hoặc B để chỉnh</div>`;

  try{if(MS.ab)MS.ab.abort();const ab=MS.ab=new AbortController();setTimeout(()=>ab.abort(),8000);
    const j=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${A.lng},${A.lat};${B.lng},${B.lat}?overview=full&geometries=geojson`,{signal:ab.signal})).json();
    const r=j.routes&&j.routes[0];if(!r)throw 0;if(!MS.ly||!MS.a||!MS.b||!MS.a.getLatLng().equals(A)||!MS.b.getLatLng().equals(B))return;
    const pts=r.geometry.coordinates.map(c=>[c[1],c[0]]);MS.rt=L.layerGroup([L.polyline(pts,{color:'#fff',weight:9,opacity:.9}),L.polyline(pts,{color:'#ef4444',weight:5,opacity:.95})]).addTo(MS.ly);

    if(fit)map.fitBounds(L.latLngBounds(pts.concat([A,B])),{paddingTopLeft:[40,160],paddingBottomRight:[70,220],maxZoom:17});measUI(box(r))}catch(e){if(MS.ly&&MS.b&&MS.b.getLatLng().equals(B))measUI(box(0))}}

  $('#avf').onchange=ev=>{const f=ev.target.files[0];if(!f)return;resizeImg(f,u=>{S.av=u;LS.set('av',u);API.saveProfile({av:u}).catch(()=>{});pushId();toast('Đã đổi ảnh');drawSet();drawPeople();drawMarkers()})};
  if($('#rmav'))$('#rmav').onclick=()=>{S.av='';LS.set('av','');API.saveProfile({av:''}).catch(()=>{});pushId();drawSet();drawMarkers()};
  e.querySelectorAll('[data-em]').forEach(b=>b.onclick=()=>{const x=b.dataset.em;if(takenEm().includes(x))return toast('Biểu tượng này đã có người dùng');S.em=x;LS.set('em',x);API.saveProfile({em:x}).catch(()=>{});pushId();toast('Biểu tượng của bạn: '+x);drawSet();drawMarkers();drawPlacesOnMap()});
  $('#svg').onclick=async()=>{const t=$('#gt').value.trim();if(!t)return;try{await API.patchCouple(S.code,{title:t});S.couple.title=t;toast('Đã đổi tên nhóm');drawPeople()}catch(er){toast(errMsg(er))}};
  $('#inv').onclick=shareInvite;
  e.querySelectorAll('[data-nk]').forEach(b=>b.onclick=()=>editNick(b.dataset.nk,()=>drawSet()));
  e.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const id=b.dataset.rm;if(!confirm('Gỡ '+nameOf(id)+' khỏi nhóm?'))return;
    try{const c=await API.getCouple(S.code);await API.patchCouple(S.code,{members:(c.members||[]).filter(x=>x!==id)});toast('Đã gỡ');await refresh();drawSet()}catch(er){toast(errMsg(er))}});
  e.querySelectorAll('[data-hd]').forEach(c=>c.onchange=()=>{setHide(c.dataset.hd,c.checked);toast(c.checked?'Đã ẩn vị trí với '+nameOf(c.dataset.hd)+' 🤫':'Đã hiện lại vị trí với '+nameOf(c.dataset.hd));drawSet()});
  $('#sbat').onchange=ev=>{S.showBat=ev.target.checked;LS.set('showbat',S.showBat);pushId();toast(S.showBat?'Mọi người sẽ thấy % pin của bạn':'Đã ẩn % pin')};
  e.querySelectorAll('.mopt').forEach(b=>b.onclick=async()=>{await setMode(b.dataset.m);drawSet()});
  $('#lv').onclick=()=>askLeave(doLeave);
  const doLeave=async()=>{
    try{await API.delLoc(S.code);const c=await API.getCouple(S.code);if(c)await API.patchCouple(S.code,{members:(c.members||[]).filter(x=>x!==NET.uid)})}catch(er){toast(errMsg(er));return}
    API.saveProfile({code:''}).catch(()=>{});toast('Đã rời nhóm');leaveLocal()}}
