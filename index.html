<style>
:root{--pk:#e8577a;--pk2:#fde4ea;--bl:#3b82f6;--bl2:#dbeafe;--ink:#1f2330;--mut:#6b7280;--bg:#fff7f9;--card:#fff;--ln:#f1d5dc;--ok:#16a34a;--warn:#d97706;--sh:0 6px 24px rgba(232,87,122,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.page{flex:1;position:relative;overflow:hidden}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:16px 16px 24px;padding-top:calc(16px + env(safe-area-inset-top))}
nav{display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 6px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}

#map{position:absolute;inset:0;z-index:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;background:var(--pk);color:#fff;font-weight:600;min-height:46px}
.btn.sec{background:var(--pk2);color:var(--pk)}
.btn.gh{background:#fff;color:var(--ink);border:1px solid var(--ln)}
.btn.red{background:#fee2e2;color:#b91c1c}
.btn.w{width:100%}
.btn:disabled{opacity:.5}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
h1{font-size:26px;margin:8px 0 4px}
h2{font-size:18px;margin:0 0 10px}
.mut{color:var(--mut);font-size:13px}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input.t,select.t,textarea.t{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:#fff;font-size:16px}
textarea.t{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
/* thanh trạng thái chia sẻ */
.top{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none}

.share{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 6px 6px 12px;box-shadow:var(--sh);font-size:13px;font-weight:600}
.share .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:pu 2s infinite}

.ptn{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none}

.ptn .st{font-size:13px;color:var(--mut)}

.ptn .acts{margin-left:auto;display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:12px;background:var(--pk2);color:var(--pk);display:grid;place-items:center;font-size:18px}
.fab{position:absolute;right:12px;z-index:500;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;font-size:20px}
.ping{background:#fff4e5;color:#92400e;border-radius:14px;padding:10px 12px;font-size:13px;box-shadow:var(--sh)}
/* marker */
.mk{display:flex;flex-direction:column;align-items:center}

.pm{font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));text-align:center;line-height:1}
.pick{position:absolute;left:12px;right:12px;bottom:12px;z-index:600;background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh);text-align:center}
/* địa điểm */

.chip{padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--ln);font-size:13px;white-space:nowrap}

.pl .nm{font-weight:700}

.tag.w{background:#fef3c7;color:#92400e}
.srate{display:flex;gap:4px;font-size:32px}
.srate button{color:#e5e7eb;padding:0 2px}
.srate button.on{color:#f59e0b}
.seg{display:flex;background:#f3f4f6;border-radius:12px;padding:3px}

.sheet{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}

ul.ck{padding-left:20px;margin:6px 0}

.hero{text-align:center;font-size:56px;margin-top:10px}
.ppl{background:#fff;border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:14px;cursor:pointer}
.pls{max-height:38vh;overflow-y:auto;border-top:1px solid var(--ln)}
.pr{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid #f7e6ea}
.pr:last-child{border:0}
.pr .av{width:36px;height:36px;font-size:15px}
.pr .nm{font-weight:700;font-size:14px}.pr .st{font-size:12px;color:var(--mut)}.pr .st b{color:var(--ink);font-weight:600}
.pr .acts{margin-left:auto;display:flex;gap:6px}.pr .ib{width:34px;height:34px;font-size:15px}
.ib.sm{width:30px;height:30px;font-size:14px}
.av{color:#fff}
.av{position:relative;background-repeat:no-repeat}
.av .eb{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:14px;background:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.flag{position:relative;width:70px;height:40px}
.flag .fl{position:absolute;left:4px;top:0;background:#fff;border:2px solid var(--pk);border-radius:8px 8px 8px 0;padding:1px 4px;font-size:15px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.flag .fl small{font-size:10px;font-weight:700;color:var(--pk);margin-left:2px}
.flag .fp{position:absolute;left:4px;top:4px;width:2px;height:34px;background:var(--pk)}
.vis{font-size:13px;margin-top:2px}
.emg{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emg button{font-size:22px;padding:6px 0;border-radius:10px;background:#fff;border:1px solid var(--ln)}
.emg button.on{border:2px solid var(--pk);background:var(--pk2)}
.emg button:disabled{opacity:.25}
#vf button{font-size:12.5px;padding:8px 2px}
.qa{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.qa button{padding:8px 10px;border-radius:10px;background:var(--pk2);color:var(--pk);font-weight:600;font-size:13px;text-align:left}
.mopt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--ln);background:#fff;margin-bottom:8px}
.mopt b{display:block;font-size:15px}.mopt span{font-size:13px;color:var(--mut)}
.mopt.on{border:2px solid var(--pk);background:var(--pk2)}

<body>
<div id="app"></div>
<script>
'use strict';
// ===== Cấu hình máy chủ (Firestore qua REST, đăng nhập ẩn danh) =====
const FB={apiKey:"AIzaSyA8VPIZIhQjpcXeB6PD_G2b9FfVp7wmReM",projectId:"everything-2dec6"};
const COL='doita'; // couples: doita/{mã} ; vị trí: doita/{mã}/loc/{uid} ; địa điểm: doita/{mã}/places/{id}
const DEMO=/[?&]demo=1/.test(location.search);

// ===== Lưu trữ cục bộ =====
const LS={get(k,d){try{const v=localStorage.getItem('dt_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('dt_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('dt_'+k)}catch(e){}}};

// ===== Mã hoá giá trị Firestore =====
function enc(v){if(v===null||v===undefined)return{nullValue:null};if(typeof v==='boolean')return{booleanValue:v};
  if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(enc)}};
  if(typeof v==='object'){const f={};for(const k in v)f[k]=enc(v[k]);return{mapValue:{fields:f}}}return{stringValue:String(v)}}
function dec(x){if(!x)return null;if('stringValue'in x)return x.stringValue;if('integerValue'in x)return+x.integerValue;if('doubleValue'in x)return x.doubleValue;
  if('booleanValue'in x)return x.booleanValue;if('nullValue'in x)return null;if('timestampValue'in x)return Date.parse(x.timestampValue);
  if('arrayValue'in x)return(x.arrayValue.values||[]).map(dec);if('mapValue'in x)return decF(x.mapValue.fields||{});return null}
function decF(f){const o={};for(const k in f)o[k]=dec(f[k]);return o}
const encF=o=>{const f={};for(const k in o)f[k]=enc(o[k]);return f};

// ===== Máy chủ thật =====
const NET={tok:null,uid:null,exp:0};
const ff=(u,o={})=>fetch(u,Object.assign({signal:AbortSignal.timeout?AbortSignal.timeout(12000):undefined},o));
async function auth(){
  if(NET.tok&&Date.now()<NET.exp-60e3)return NET.tok;
  const k=FB.apiKey,sv=LS.get('fb',null);let r;
  if(sv&&sv.rt){try{r=await (await ff(`https://securetoken.googleapis.com/v1/token?key=${k}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(sv.rt)})).json();
    if(r.id_token){NET.tok=r.id_token;NET.uid=r.user_id;NET.exp=Date.now()+(+r.expires_in||3600)*1e3;LS.set('fb',{rt:r.refresh_token,uid:r.user_id});return NET.tok}}catch(e){if(sv.uid){NET.uid=sv.uid;throw new Error('offline')}}}
  if(sv&&sv.rt&&r&&r.error)throw new Error('SESSION_EXPIRED');
  throw new Error('NOAUTH')}
// ===== Tài khoản: tên đăng nhập + mật khẩu (Firebase Email/Password) =====
const normU=u=>String(u||'').trim().toLowerCase();
const EMAIL=u=>normU(u)+'@everything-app.web.app';
function setSess(r){NET.tok=r.idToken;NET.uid=r.localId;NET.exp=Date.now()+(+r.expiresIn||3600)*1e3;LS.set('fb',{rt:r.refreshToken,uid:r.localId})}
async function idt(path,body){const r=await (await ff(`https://identitytoolkit.googleapis.com/v1/accounts:${path}?key=${FB.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({returnSecureToken:true},body))})).json();
  if(r.error)throw new Error(r.error.message||'AUTH');return r}
const base=()=>`https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
async function req(path,o={}){const t=await auth();const r=await ff(base()+path,Object.assign({},o,{headers:{'Content-Type':'application/json',Authorization:'Bearer '+t}}));
  if(r.status===404)return null;const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error((j.error&&j.error.message)||('HTTP '+r.status));e.status=r.status;throw e}return j}
const mask=o=>Object.keys(o).map(k=>'updateMask.fieldPaths='+encodeURIComponent(k)).join('&');
const REAL={
  async uid(){await auth();return NET.uid},
  async register(u,p){const sv=LS.get('fb',null);
    if(sv&&sv.rt){let t=null;try{t=await auth()}catch(e){}if(t){setSess(await idt('update',{idToken:t,email:EMAIL(u),password:p}));return}}
    setSess(await idt('signUp',{email:EMAIL(u),password:p}))},
  async login(u,p){setSess(await idt('signInWithPassword',{email:EMAIL(u),password:p}))},
  async getProfile(){const d=await req(`/users/${NET.uid}`);return d?decF(d.fields||{}):{}},
  async saveProfile(o){await req(`/users/${NET.uid}?${mask(o)}`,{method:'PATCH',body:JSON.stringify({fields:encF(o)})})},
  async getCouple(c){const d=await req(`/${COL}/${c}`);return d?decF(d.fields||{}):null},
  async createCouple(c,title){await req(`/${COL}/${c}?currentDocument.exists=false`,{method:'PATCH',body:JSON.stringify({fields:encF({members:[NET.uid],title:title||'',t:Date.now()})})})},
  async patchCouple(c,o){await req(`/${COL}/${c}?${mask(o)}&currentDocument.exists=true`,{method:'PATCH',body:JSON.stringify({fields:encF(o)})})},
  async setLoc(c,o){await req(`/${COL}/${c}/loc/${NET.uid}`,{method:'PATCH',body:JSON.stringify({fields:encF(o)})})},
  async delLoc(c){await req(`/${COL}/${c}/loc/${NET.uid}`,{method:'DELETE'})},
  async listLoc(c){const j=await req(`/${COL}/${c}/loc?pageSize=10`);return((j&&j.documents)||[]).map(d=>Object.assign({id:d.name.split('/').pop()},decF(d.fields||{})))},
  async listPlaces(c){let out=[],tk='';for(let i=0;i<10;i++){const j=await req(`/${COL}/${c}/places?pageSize=300${tk?'&pageToken='+tk:''}`);
    out=out.concat(((j&&j.documents)||[]).map(d=>Object.assign({id:d.name.split('/').pop()},decF(d.fields||{}))));if(!j||!j.nextPageToken)break;tk=j.nextPageToken}return out},
  async savePlace(c,id,o){await req(`/${COL}/${c}/places/${id}?${mask(o)}`,{method:'PATCH',body:JSON.stringify({fields:encF(o)})})},
  async delPlace(c,id){await req(`/${COL}/${c}/places/${id}`,{method:'DELETE'})}
};
// ===== Máy chủ giả để xem thử (?demo=1): lưu trong máy, có người yêu giả =====
const MOCK=(()=>{const db=()=>LS.get('mock',{c:{},loc:{},pl:{}}),sv=d=>LS.set('mock',d);const me='me_demo';
  return{async uid(){NET.uid=me;return me},
  async register(u,p){const A=LS.get('mockacc',{});if(A[u])throw new Error('EMAIL_EXISTS');A[u]={p};LS.set('mockacc',A);NET.uid=me},
  async login(u,p){const A=LS.get('mockacc',{});if(!A[u]||A[u].p!==p)throw new Error('INVALID_LOGIN_CREDENTIALS');NET.uid=me},
  async getProfile(){return LS.get('mockprof',{})},
  async saveProfile(o){LS.set('mockprof',Object.assign(LS.get('mockprof',{}),o))},
  async getCouple(c){return db().c[c]||null},
  async createCouple(c,title){const d=db();d.c[c]={members:[me,'ny_demo','ban_demo','me_demo2'],title,t:Date.now()};d.loc[c]={ny_demo:{name:'Người yêu',em:'🐰',sharing:true,lat:21.0306,lng:105.8466,acc:25,bat:63,t:Date.now()-4*60e3},ban_demo:{name:'Minh',em:'🐶',sharing:true,lat:21.0180,lng:105.8300,acc:40,t:Date.now()-75*60e3},me_demo2:{name:'Mẹ',sharing:false,t:Date.now()-20*60e3}};d.pl[c]={p1:{name:'Phở Thìn',cat:'eat',lat:21.0285,lng:105.8530,v_ny_demo:true,v_ban_demo:true,r_ny_demo:5,t:Date.now()-1e6,by:'ny_demo'},p2:{name:'Hồ Tây chiều',cat:'fun',lat:21.0550,lng:105.8180,t:Date.now()-2e6,by:'ny_demo'},p3:{name:'Cà phê trứng',cat:'drink',lat:21.0335,lng:105.8505,v_ban_demo:true,t:Date.now()-3e6,by:'ban_demo'}};sv(d)},
  async patchCouple(c,o){const d=db();Object.assign(d.c[c],o);sv(d)},
  async setLoc(c,o){const d=db();(d.loc[c]=d.loc[c]||{})[me]=o;sv(d)},
  async delLoc(c){const d=db();if(d.loc[c])delete d.loc[c][me];sv(d)},
  async listLoc(c){const L=db().loc[c]||{};return Object.keys(L).map(k=>Object.assign({id:k},L[k]))},
  async listPlaces(c){const L=db().pl[c]||{};return Object.keys(L).map(k=>Object.assign({id:k},L[k]))},
  async savePlace(c,id,o){const d=db();const P=(d.pl[c]=d.pl[c]||{});P[id]=Object.assign(P[id]||{},o);sv(d)},
  async delPlace(c,id){const d=db();if(d.pl[c])delete d.pl[c][id];sv(d)}}})();
const API=DEMO?MOCK:REAL;

// ===== Trạng thái =====
const S={approx:LS.get('approx',false),user:LS.get('user',''),name:LS.get('name',''),em:LS.get('em',''),av:LS.get('av',''),vf:'all',code:LS.get('code',''),sharing:LS.get('sharing',true),tab:'map',
  me:null,ptn:null,couple:null,places:LS.get('places_cache',[]),filter:'all',sort:'new',lastSent:0,lastSentPos:null,pos:null,bat:null,err:null,pick:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=n=>(String(n||'?').trim()[0]||'?').toUpperCase();
function ago(t){if(!t)return'chưa có';const s=Math.max(0,(Date.now()-t)/1000);if(s<60)return'vừa xong';const m=s/60;if(m<60)return Math.floor(m)+' phút trước';const h=m/60;if(h<24)return Math.floor(h)+' giờ trước';
  const d=new Date(t);return d.toLocaleDateString('vi-VN')+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
function dist(a,b){if(!a||!b)return null;const R=6371e3,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const fmtD=m=>m==null?'':m<1000?Math.round(m)+' m':(m/1000).toFixed(m<10e3?1:0)+' km';
function toast(t,ms=2600){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),ms)}

function errMsg(e){const m=String(e&&e.message||e);
  const AE={EMAIL_EXISTS:'Tên đăng nhập này đã có người dùng',INVALID_LOGIN_CREDENTIALS:'Sai tên đăng nhập hoặc mật khẩu',EMAIL_NOT_FOUND:'Sai tên đăng nhập hoặc mật khẩu',INVALID_PASSWORD:'Sai tên đăng nhập hoặc mật khẩu',
    WEAK_PASSWORD:'Mật khẩu ít nhất 6 ký tự',OPERATION_NOT_ALLOWED:'Firebase chưa bật đăng nhập Email/Password',TOO_MANY_ATTEMPTS_TRY_LATER:'Thử sai nhiều quá, đợi một lúc nhé',NOAUTH:'Bạn cần đăng nhập lại',SESSION_EXPIRED:'Phiên đăng nhập hết hạn, hãy đăng nhập lại',CREDENTIAL_TOO_OLD_LOGIN_AGAIN:'Hãy đăng nhập lại rồi thử'};
  for(const k in AE)if(m.startsWith(k))return AE[k];if(/PERMISSION|permission/.test(m))return'Máy chủ chưa cho phép. Cần dán luật bảo mật Firestore (xem hướng dẫn).';if(/offline|Failed to fetch|network|timeout|aborted/i.test(m))return'Không có mạng, thử lại sau nhé';return m}

// lớp bản đồ: thử OpenStreetMap trước, lỗi nhiều thì chuyển sang Esri
const TILES=[['https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap',referrerPolicy:'strict-origin-when-cross-origin'}],
  ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}]];
function addTiles(i){i=i==null?LS.get('tile',0):i;if(i>=TILES.length)i=0;const [u,o]=TILES[i];const t=L.tileLayer(u,o).addTo(map);let bad=0,ok=0;
  let sw=false;const swap=()=>{if(sw||ok>0)return;sw=true;map.removeLayer(t);const n=(i+1)%TILES.length;LS.set('tile',n);addTiles(n)};
  t.on('tileload',()=>{ok++});t.on('tileerror',()=>{bad++;if(bad>=4)swap()});setTimeout(swap,6000)}

function others(){const m=((S.couple&&S.couple.members)||[]).filter(x=>x!==NET.uid);return m.map(id=>(S.locs||[]).find(l=>l.id===id)||{id,name:null})}

function personRow(p){const me=S.pos||(S.me&&S.me.lat!=null?S.me:null);let st;
  if(!p.t)st='Chưa mở app lần nào';

  else{const age=(Date.now()-p.t)/60e3,cls=age<10?'fresh':age>60?'stale':'',d=dist(me,p);st=`<span class="${cls}">● ${ago(p.t)}</span>${p.approx?' · <b>khu vực gần đúng</b>':''}${d!=null?' · cách '+(p.approx?'~':'')+fmtD(d):''}${p.bat!=null?' · 🔋'+p.bat+'%':''}`}
  const canNav=p.sharing!==false&&p.lat!=null;
  return`<div class="pr" data-id="${p.id}">${avHtml(p,36)}<div class="grow"><div class="nm">${esc(p.name||'Thành viên mới')}</div><div class="st">${st}</div></div>

function pushId(){if(!S.code)return;if(S.sharing&&S.pos){S.lastSent=0;sendLoc()}else API.setLoc(S.code,Object.assign(idDoc(),{sharing:S.sharing&&!!S.me&&S.me.sharing!==false,t:Date.now()},S.sharing&&S.me&&S.me.lat!=null?{lat:S.me.lat,lng:S.me.lng,acc:S.me.acc||0,approx:!!S.me.approx}:{})).catch(()=>{})}
function resizeImg(file,cb){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const N=96,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');
  const m=Math.min(im.width,im.height);g.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,N,N);cb(c.toDataURL('image/jpeg',.72))};im.onerror=()=>toast('Không đọc được ảnh này');im.src=fr.result};fr.readAsDataURL(file)}

let watchId=null;
function startGeo(){if(!S.sharing||watchId!=null||!navigator.geolocation)return;
  watchId=navigator.geolocation.watchPosition(onPos,onGeoErr,{enableHighAccuracy:true,maximumAge:15e3,timeout:30e3});
  if(navigator.getBattery)navigator.getBattery().then(b=>{const f=()=>S.bat=Math.round(b.level*100);f();b.addEventListener('levelchange',f)}).catch(()=>{})}
function stopGeo(){if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null}
function locateOnce(center){if(!navigator.geolocation)return toast('Máy không hỗ trợ định vị');navigator.geolocation.getCurrentPosition(p=>{onPos(p,true);if(center)map.setView([p.coords.latitude,p.coords.longitude],16)},onGeoErr,{enableHighAccuracy:true,maximumAge:0,timeout:20e3})}
function onPos(p,force){S.err=null;S.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)};drawShare();drawMarkers();drawPeople();
  if(!S.sharing)return;const moved=dist(S.lastSentPos,S.pos);
  if(force||Date.now()-S.lastSent>30e3||moved==null||moved>40)sendLoc()}
function onGeoErr(e){S.err=e.code===1?'chưa cho phép định vị':'không lấy được vị trí';drawShare();

async function sendLoc(){if(!S.pos||!S.sharing||S.sending)return;S.sending=true;const o={...idDoc(),sharing:true,lat:S.pos.lat,lng:S.pos.lng,acc:S.pos.acc,t:Date.now()};if(S.approx){o.lat=Math.round(o.lat*100)/100;o.lng=Math.round(o.lng*100)/100;o.acc=1500;o.approx=true}if(S.bat!=null)o.bat=S.bat;
  try{await API.setLoc(S.code,o);S.lastSent=o.t;S.lastSentPos=S.pos;S.me=o}catch(e){S.err=errMsg(e).slice(0,40);drawShare()}S.sending=false}

async function refresh(){if(!S.code)return;try{const uid=await API.uid();const [c,locs]=await Promise.all([API.getCouple(S.code),API.listLoc(S.code)]);
    if(!c||!(c.members||[]).includes(uid)){return kicked()}
    S.couple=c;S.locs=locs;S.me=locs.find(l=>l.id===uid)||S.me;
    const P=myPing();if(P.t&&P.t>(LS.get('pingdone',0))&&S.sharing){LS.set('pingdone',P.t);locateOnce()}
  }catch(e){if(/SESSION_EXPIRED|NOAUTH|USER_NOT_FOUND|TOKEN_EXPIRED|USER_DISABLED/.test(e.message))return forceOut();if(e.status===403){S.err='máy chủ chưa cho phép';drawShare()}}
  ensureEm();drawPeople();drawMarkers();drawPing();if(S.tab==='map'&&!(map&&map._popup&&map.hasLayer(map._popup)))drawPlacesOnMap()}
function kicked(){toast('Bạn không còn ở trong nhóm này',4000);API.saveProfile({code:''}).catch(()=>{});leaveLocal()}
function logout(){if(!confirm('Đăng xuất khỏi máy này? Đăng nhập lại bằng tên đăng nhập và mật khẩu là vào lại nhóm.'))return;doLogout()}
function forceOut(){toast('Tài khoản không còn, hãy đăng nhập hoặc tạo tài khoản mới',5000);doLogout()}
function doLogout(){
  stopGeo();clearInterval(S.iv);clearInterval(S.iv2);for(const k of ['fb','user','name','em','av','code','places_cache','pingseen','pingdone'])LS.del(k);
  Object.assign(S,{user:'',name:'',em:'',av:'',code:'',couple:null,me:null,locs:[],places:[]});NET.tok=null;NET.uid=null;fitted=false;for(const k in MK)delete MK[k];renderSetup('intro')}
function leaveLocal(){stopGeo();clearInterval(S.iv);clearInterval(S.iv2);S.code='';LS.del('code');LS.del('places_cache');S.couple=S.me=null;S.locs=[];S.places=[];fitted=false;for(const k in MK)delete MK[k];renderSetup('choose')}

async function loadPlaces(){if(!S.code)return;try{S.places=await API.listPlaces(S.code);LS.set('places_cache',S.places)}catch(e){}drawPlacesOnMap();if(S.tab==='pl')drawPlaces()}
const myR=p=>p['r_'+NET.uid]||0;

const stars=n=>{n=Math.round(n);return`<span class="stars">${'★'.repeat(n)}<span class="e">${'★'.repeat(5-n)}</span></span>`};

function drawPlaces(){const e=$('#pl');if(!e)return;const f=S.filter,vf=S.vf;let L2=S.places.slice();

      :`<div class="empty">Chưa có nơi nào. Bấm <b>＋ Thêm</b> để lưu quán ăn, quán cà phê, chỗ vui chơi đầu tiên 💕</div>`}</div>`;
  $('#srt').value=S.sort;$('#srt').onchange=ev=>{S.sort=ev.target.value;drawPlaces()};

function openPlace(p){const isNew=!p||!p.id;const d=Object.assign({cat:'eat',name:'',note:'',lat:null,lng:null,addr:''},p||{});if(d.been==null)d.been=p&&p.id?iVisited(p):false;d.my=p&&p.id&&d.my==null?myR(p):(d.my||0);

  const sync=()=>{d.name=q('#pn').value;d.note=q('#pt').value};
  q('#x').onclick=close;sh.onclick=ev=>{if(ev.target===sh)close()};
  const seg=(id,key)=>q(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{d[key]=b.dataset.v;q(id).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  seg('#pc','cat');q('#ps').querySelectorAll('button').forEach(b=>b.onclick=()=>{d.been=b.dataset.v==='1';q('#ps').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  q('#pr').querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=+b.dataset.v;d.my=d.my===v?0:v;q('#pr').querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.v<=d.my))});
  const setLL=(la,ln,ad)=>{d.lat=la;d.lng=ln;if(ad!==undefined)d.addr=ad;q('#ploc').innerHTML='📍 Đã chọn vị trí'+(d.addr?': '+esc(d.addr):'')};
  q('#here').onclick=()=>{if(S.pos)return setLL(S.pos.lat,S.pos.lng,'');navigator.geolocation.getCurrentPosition(p=>setLL(p.coords.latitude,p.coords.longitude,''),()=>toast('Không lấy được vị trí'),{enableHighAccuracy:true,timeout:15e3})};
  q('#onmap').onclick=()=>{sync();close();tab('map');$('#pick').classList.remove('hide');S.pick=(la,ln)=>{d.lat=la;d.lng=ln;d.addr='';openPlace(d)}};
  q('#qs').onclick=async()=>{const s=q('#q').value.trim();if(!s)return;q('#qr').innerHTML='<div class="mut" style="padding:8px">Đang tìm…</div>';
    try{const c=S.pos?`&viewbox=${S.pos.lng-.5},${S.pos.lat+.5},${S.pos.lng+.5},${S.pos.lat-.5}`:'';
      const r=await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=vi&countrycodes=vn${c}&q=${encodeURIComponent(s)}`)).json();
      q('#qr').innerHTML=r.length?r.map((x,i)=>`<button data-i="${i}">${esc(x.display_name)}</button>`).join(''):'<div class="mut" style="padding:8px">Không thấy. Thử “Chọn trên bản đồ”.</div>';
      q('#qr').querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=r[+b.dataset.i];const short=x.display_name.split(',').slice(0,3).join(',');if(!q('#pn').value.trim())q('#pn').value=x.display_name.split(',')[0];setLL(+x.lat,+x.lon,short);q('#qr').innerHTML=''})}
    catch(e){q('#qr').innerHTML='<div class="mut" style="padding:8px">Lỗi mạng khi tìm</div>'}};
  q('#sv').onclick=async ev=>{sync();if(!d.name.trim())return toast('Nhập tên địa điểm');ev.target.disabled=true;
    const id=d.id||(Date.now().toString(36)+Math.random().toString(36).slice(2,7));
    const o={name:d.name.trim(),cat:d.cat,note:d.note.trim(),addr:d.addr||'',['r_'+NET.uid]:d.my||0,['v_'+NET.uid]:!!d.been};if(d.status){o.status='';if(d.status==='been'&&d.by&&d.by!==NET.uid&&!('v_'+d.by in d))o['v_'+d.by]=true}
    if(d.lat!=null){o.lat=d.lat;o.lng=d.lng}if(!d.id){o.by=NET.uid;o.t=Date.now()}
    try{await API.savePlace(S.code,id,o);close();toast('Đã lưu ⭐');await loadPlaces()}catch(e){ev.target.disabled=false;toast(errMsg(e))}};
  if(!isNew)q('#del').onclick=async()=>{if(!confirm('Xoá “'+d.name+'”?'))return;try{await API.delPlace(S.code,d.id);close();toast('Đã xoá');loadPlaces()}catch(e){toast(errMsg(e))}};
  if(isNew&&!d.name)setTimeout(()=>q('#pn').focus(),100)}
window.openPlace=openPlace;

// ===== Tìm địa điểm trên bản đồ, gắn 🚩 đã đi / ⭐ chưa đi =====
const fold=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
function guessCat(x){const t=(x.type||'')+' '+(x.class||'')+' '+(x.category||'');
  if(/cafe|coffee|tea|bubble/.test(t))return'drink';if(/restaurant|fast_food|food|bar|pub|bakery|ice_cream|biergarten/.test(t))return'eat';
  if(/attraction|park|museum|cinema|theatre|zoo|theme|viewpoint|mall|leisure|tourism|beach|garden|stadium|amusement/.test(t))return'fun';return'other'}
let tmpMk=null;
const POP={minWidth:220,autoPanPaddingTopLeft:[10,250],autoPanPaddingBottomRight:[70,20]};
function collapsePpl(){if(S.pplOpen!==false){S.pplOpen=false;drawPeople()}}
function openSearch(){const sh=document.createElement('div');sh.className='sheet';sh.innerHTML=`<div>
  <div class="row"><input class="t grow" id="sq" placeholder="Tìm quán, địa chỉ… (vd: phở, Hồ Gươm)" enterkeyhint="search"><button class="btn" id="sgo">Tìm</button><button class="ib" id="sx">✕</button></div>
  <div id="sres" class="sres" style="margin-top:8px"></div></div>`;
  document.body.appendChild(sh);const q=x=>sh.querySelector(x),close=()=>sh.remove();q('#sx').onclick=close;sh.onclick=ev=>{if(ev.target===sh)close()};
  const run=async()=>{const t=q('#sq').value.trim();if(!t)return;const ft=fold(t);
    const mine=S.places.filter(p=>fold(p.name+' '+(p.addr||'')).includes(ft)).slice(0,8);
    const mineHtml=mine.map(p=>{const V=visitors(p);return`<button data-pid="${p.id}"><b>${V.length?'🚩 '+emList(V).join(''):'⭐'} ${esc(p.name)}</b><br><span class="mut">Đã lưu · ${(CATS[p.cat]||CATS.other).n}${p.addr?' · '+esc(p.addr):''}</span></button>`}).join('');
    q('#sres').innerHTML=mineHtml+'<div class="mut" style="padding:8px">Đang tìm trên bản đồ…</div>';bindMine();
    let r=[];try{const c=map.getCenter(),vb=`&viewbox=${c.lng-.6},${c.lat+.6},${c.lng+.6},${c.lat-.6}`;
      r=await (await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&accept-language=vi&countrycodes=vn${vb}&q=${encodeURIComponent(t)}`)).json()}catch(e){}
    const on=r.map((x,i)=>{const near=S.places.find(p=>p.lat!=null&&dist(p,{lat:+x.lat,lng:+x.lon})<60);const nm=x.name||x.display_name.split(',')[0];
      return`<button data-i="${i}">${near?(visitors(near).length?'🚩 ':'⭐ '):'📍 '}<b>${esc(nm)}</b><br><span class="mut">${esc(x.display_name.split(',').slice(1,4).join(','))}${near?' · đã lưu':''}</span></button>`}).join('');
    q('#sres').innerHTML=mineHtml+(on||(!mine.length?'<div class="mut" style="padding:8px">Không thấy. Thử gõ khác đi, hoặc thêm tên phường/quận.</div>':''));bindMine();
    q('#sres').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const x=r[+b.dataset.i];close();showFound(x)})};
  const bindMine=()=>q('#sres').querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>{close();focusPlace(b.dataset.pid)});
  q('#sgo').onclick=run;q('#sq').onkeydown=ev=>{if(ev.key==='Enter')run()};setTimeout(()=>q('#sq').focus(),100)}
function focusPlace(id){const p=S.places.find(x=>x.id===id);if(!p)return;tab('map');if(p.lat==null)return openPlace(p);
  if(S.vf!=='all'){S.vf='all';drawPlacesOnMap()}collapsePpl();map.setView([p.lat,p.lng],17,{animate:false});setTimeout(()=>{plLayer.eachLayer(l=>{if(l._pid===id)l.openPopup()})},300)}
function showFound(x){tab('map');const lat=+x.lat,lng=+x.lon;const near=S.places.find(p=>p.lat!=null&&dist(p,{lat,lng})<60);if(near)return focusPlace(near.id);
  if(tmpMk)map.removeLayer(tmpMk);const nm=x.name||x.display_name.split(',')[0],addr=x.display_name.split(',').slice(1,4).join(',').trim();
  S.found={name:nm,addr,lat,lng,cat:guessCat(x)};
  collapsePpl();map.setView([lat,lng],17,{animate:false});
  tmpMk=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="pm" style="font-size:30px">📍</div>',iconSize:[34,34],iconAnchor:[17,30]}),zIndexOffset:500}).addTo(map)
    .bindPopup(`<b>${esc(nm)}</b><br><span style="color:#6b7280">${esc(addr)}</span><div class="qa"><button onclick="quickAdd(true)">🚩 ${S.em||''} Mình đã đi</button><button onclick="quickAdd(false)">⭐ Lưu: chưa đi</button></div>`,POP).openPopup()}
async function quickAdd(been){const f=S.found;if(!f)return;const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const o={name:f.name.slice(0,60),cat:f.cat,note:'',addr:f.addr.slice(0,120),lat:f.lat,lng:f.lng,by:NET.uid,t:Date.now(),['v_'+NET.uid]:!!been,['r_'+NET.uid]:0};
  try{await API.savePlace(S.code,id,o);if(tmpMk){map.removeLayer(tmpMk);tmpMk=null}S.found=null;toast(been?'Đã cắm cờ 🚩':'Đã lưu vào “Chưa đi” ⭐');await loadPlaces();focusPlace(id)}catch(e){toast(errMsg(e))}}
window.quickAdd=quickAdd;

// ===== Cài đặt =====
function drawSet(){const e=$('#set');const M=(S.couple&&S.couple.members)||[],owner=M[0]===NET.uid;
  e.innerHTML=`<h1>Cài đặt</h1>
  <div class="card"><h2>Tài khoản</h2>${S.user?`<p class="mut" style="margin-top:0">Đăng nhập với tên <b>${esc(S.user)}</b>. Đổi máy thì đăng nhập lại là vào đúng nhóm.</p><button class="btn gh w" id="lo">Đăng xuất</button>`
    :`<p class="mut" style="margin-top:0"><b style="color:#b91c1c">Chưa có tài khoản.</b> Nếu xoá app hay thoát ra, bạn sẽ mất nhóm này. Tạo tài khoản để giữ lại:</p>
      <label class="f">Tên đăng nhập</label><input class="t" id="us" maxlength="30" autocapitalize="none" autocomplete="username"><label class="f">Mật khẩu (ít nhất 6 ký tự)</label><input class="t" id="pw" type="password" autocomplete="new-password">
      <div style="height:10px"></div><button class="btn w" id="mkacc">Tạo tài khoản</button>`}</div>
  <div class="card"><h2>Tên, ảnh và biểu tượng</h2>
    <div class="row" style="gap:12px">${avHtml({id:NET.uid,name:S.name,em:S.em,av:S.av},64)}<div class="grow"><button class="btn sec w" id="upav">📷 ${S.av?'Đổi ảnh':'Tải ảnh lên'}</button>${S.av?'<button class="btn gh w" id="rmav" style="margin-top:6px;min-height:36px">Bỏ ảnh</button>':''}</div></div>
    <input type="file" id="avf" accept="image/*" class="hide">
    <label class="f">Tên hiển thị</label><div class="row"><input class="t grow" id="nm" maxlength="20" value="${esc(S.name)}"><button class="btn" id="svn">Lưu</button></div>
    <label class="f">Biểu tượng riêng của bạn (cắm cờ ở quán bạn đã đến). Biểu tượng mờ là đã có người dùng.</label>
    <div class="emg">${EMOJIS.map(x=>{const t=takenEm().includes(x);return`<button data-em="${x}" class="${x===S.em?'on':''}" ${t?'disabled':''}>${x}</button>`}).join('')}</div></div>
  <div class="card"><h2>Nhóm</h2>
    <div class="row"><input class="t grow" id="gt" maxlength="30" value="${esc(gName())}"><button class="btn sec" id="svg">Đổi tên</button></div>
    <div class="code">${fmtCode(S.code)}</div>
    <button class="btn w" id="inv">Gửi link mời</button>
    <p class="mut">Ai có mã này và bấm Đồng ý đều vào được nhóm (tối đa ${MAXM} người). Chỉ gửi cho người bạn tin tưởng.</p>
    <h2 style="margin-top:14px">Thành viên (${M.length})</h2>
    ${M.map((id,i)=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--ln)">${avHtml(personOf(id),32)}
      <div class="grow">${esc(nameOf(id))}${id===NET.uid?' (bạn)':''}${i===0?' <span class="tag">Trưởng nhóm</span>':''}</div>
      ${owner&&id!==NET.uid?`<button class="btn red" style="min-height:34px;padding:6px 10px;font-size:13px" data-rm="${id}">Gỡ</button>`:''}</div>`).join('')}
    ${owner?'<p class="mut">Trưởng nhóm có thể gỡ người khác, ví dụ khi ai đó đổi máy (họ vào lại bằng mã).</p>':''}</div>
  <div class="card"><h2>Chia sẻ vị trí</h2>${MODES.map(([k,n,d])=>`<button class="mopt${k===curMode()?' on':''}" data-m="${k}"><b>${n}</b><span>${d}</span></button>`).join('')}</div>
  <div class="card"><h2>Về vị trí khi tắt app</h2><p class="mut" style="margin-top:0">Đây là ứng dụng web nên điện thoại chỉ cho gửi vị trí <b>khi app đang mở</b>. Mỗi lần mở app là vị trí mới được gửi ngay, và mọi người luôn thấy “cập nhật lúc nào”. Nút 🔔 để nhờ ai đó mở app cập nhật.</p>
    <p class="mut">Nếu muốn vị trí tự cập nhật cả khi đã tắt app, có thể bật thêm <b>Chia sẻ vị trí của Google Maps</b> (Android và iPhone) hoặc <b>Tìm (Find My)</b> nếu mọi người dùng iPhone.</p></div>
  <div class="card"><h2>Rời nhóm</h2><p class="mut" style="margin-top:0">Xoá vị trí của bạn khỏi máy chủ và rời khỏi nhóm này.</p><button class="btn red w" id="lv">Rời nhóm</button></div>
  <p class="mut" style="text-align:center">Everything · phiên bản 9${DEMO?' · xem thử':''}</p>`;
  if($('#lo'))$('#lo').onclick=logout;
  if($('#mkacc'))$('#mkacc').onclick=async ev=>{const u=normU($('#us').value),p=$('#pw').value;if(!/^[a-z0-9._-]{3,30}$/.test(u))return toast('Tên đăng nhập 3–30 ký tự, chỉ chữ không dấu, số, dấu chấm, gạch',4000);if(p.length<6)return toast('Mật khẩu ít nhất 6 ký tự');
    ev.target.disabled=true;try{await API.register(u,p);S.user=u;LS.set('user',u);await API.saveProfile({name:S.name,user:u,code:S.code});toast('Đã tạo tài khoản ✅');drawSet()}catch(er){ev.target.disabled=false;toast(errMsg(er),4500)}};
  $('#svn').onclick=()=>{const n=$('#nm').value.trim();if(!n)return;S.name=n;LS.set('name',n);API.saveProfile({name:n}).catch(()=>{});toast('Đã đổi tên');if(S.sharing&&S.pos)sendLoc();else pushId();drawShare();drawMarkers()};
  $('#upav').onclick=()=>$('#avf').click();
  $('#avf').onchange=ev=>{const f=ev.target.files[0];if(!f)return;resizeImg(f,u=>{S.av=u;LS.set('av',u);API.saveProfile({av:u}).catch(()=>{});pushId();toast('Đã đổi ảnh');drawSet();drawPeople();drawMarkers()})};
  if($('#rmav'))$('#rmav').onclick=()=>{S.av='';LS.set('av','');API.saveProfile({av:''}).catch(()=>{});pushId();drawSet();drawMarkers()};
  e.querySelectorAll('[data-em]').forEach(b=>b.onclick=()=>{const x=b.dataset.em;if(takenEm().includes(x))return toast('Biểu tượng này đã có người dùng');S.em=x;LS.set('em',x);API.saveProfile({em:x}).catch(()=>{});pushId();toast('Biểu tượng của bạn: '+x);drawSet();drawMarkers();drawPlacesOnMap()});
  $('#svg').onclick=async()=>{const t=$('#gt').value.trim();if(!t)return;try{await API.patchCouple(S.code,{title:t});S.couple.title=t;toast('Đã đổi tên nhóm');drawPeople()}catch(er){toast(errMsg(er))}};
  $('#inv').onclick=shareInvite;
  e.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const id=b.dataset.rm;if(!confirm('Gỡ '+nameOf(id)+' khỏi nhóm?'))return;
    try{const c=await API.getCouple(S.code);await API.patchCouple(S.code,{members:(c.members||[]).filter(x=>x!==id)});toast('Đã gỡ');await refresh();drawSet()}catch(er){toast(errMsg(er))}});
  e.querySelectorAll('.mopt').forEach(b=>b.onclick=async()=>{await setMode(b.dataset.m);drawSet()});
  $('#lv').onclick=async()=>{if(!confirm('Rời nhóm? Vị trí của bạn sẽ bị xoá và mọi người sẽ không thấy bạn nữa.'))return;
    try{await API.delLoc(S.code);const c=await API.getCouple(S.code);if(c)await API.patchCouple(S.code,{members:(c.members||[]).filter(x=>x!==NET.uid)})}catch(er){toast(errMsg(er));return}
    API.saveProfile({code:''}).catch(()=>{});toast('Đã rời nhóm');leaveLocal()}}

if('serviceWorker'in navigator&&!DEMO)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
</html>
